name: Android APK validation

on:
  pull_request:
    paths:
      - "android/**"
      - "scripts/build_android_apk.sh"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "scripts/build_android_apk.sh"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Validate build script syntax
        run: bash -n scripts/build_android_apk.sh

      - name: Build debug APK
        run: bash scripts/build_android_apk.sh --version 0.1.0-ci --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-android-debug-apk
          path: Hermes-Agent-0.1.0-ci-debug.apk
          if-no-files-found: error
