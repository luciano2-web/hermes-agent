// Root build file: versions of the plugins applied by :app.
//
// Chaquopy 17.x supports Android Gradle plugin 7.3 - 9.4 and Python 3.10 - 3.15
// (https://chaquo.com/chaquopy/doc/current/versions.html). The app targets
// Python 3.13 because that is the newest version for which Android wheels of
// hermes-agent's native dependencies (pydantic-core, jiter) are published.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.chaquo.python' version '17.1.0' apply false
}
