plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Chaquopy compiles the app's Python sources to .pyc on the build machine, which
// requires a Python whose major.minor matches the app's (3.13). Honour an explicit
// override, else look for python3.13 on PATH; if neither is found the Chaquopy
// plugin reports its own error while configuring.
def resolveBuildPython() {
    def candidates = []
    def fromEnv = System.getenv('HERMES_BUILD_PYTHON')
    if (fromEnv) {
        candidates << fromEnv
    }
    candidates << 'python3.13'
    for (candidate in candidates) {
        try {
            def process = new ProcessBuilder(candidate, '-c',
                    'import sys; sys.exit(0 if sys.version_info[:2] == (3, 13) else 1)')
                    .redirectErrorStream(true).start()
            if (process.waitFor() == 0) {
                return candidate
            }
        } catch (Exception ignored) {
            // Not on PATH (or not executable): try the next candidate.
        }
    }
    return null
}

def buildPythonCmd = resolveBuildPython()
// The build script and CI export ANDROID_KEYSTORE_PATH, which may live outside the
// project (CI decodes it into the runner temp dir); a local build falls back to the
// conventional in-project location.
def releaseKeystore = file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'keystore/hermes-release.keystore')

android {
    namespace 'com.nousresearch.hermes'
    compileSdk 34

    defaultConfig {
        applicationId "com.nousresearch.hermes"
        minSdk 24
        targetSdk 34
        // Set by scripts/build_android_apk.sh / CI with -P, so versioning never
        // rewrites this file. Defaults keep a bare `gradlew assembleDebug` buildable.
        versionCode (project.findProperty('androidVersionCode')?.toString()?.toInteger() ?: 1)
        versionName (project.findProperty('androidVersionName')?.toString() ?: "1.0.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true

        // Android wheels only exist for these two ABIs (Chaquopy's index covers
        // both, ririv's android-wheels covers both); shipping armeabi-v7a or x86
        // would make pip fail for that ABI.
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv('ANDROID_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'hermes'
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
        release {
            // R8 shrinking is off: the Python runtime and Chaquopy's generated
            // bindings are not analysed by ProGuard rules we can trust here.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Fall back to debug keys so `assembleRelease` still yields an
            // installable APK when no release keystore has been provisioned.
            signingConfig releaseKeystore.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Configuration for Chaquopy (Python for Android).
chaquopy {
    defaultConfig {
        version = '3.13'
        if (buildPythonCmd != null) {
            buildPython buildPythonCmd
        }
        pip {
            // The pin set in requirements-android.txt is the full dependency
            // closure, pre-verified against the Android wheel indexes. --no-deps
            // is required: hermes-agent's own metadata pins pydantic==2.13.4,
            // whose pydantic-core has no Android wheel.
            options '--no-deps'
            // pydantic-core / jiter Android wheels, absent from Chaquopy's index.
            options '--extra-index-url', 'https://ririv.github.io/android-wheels/'
            install '-r', 'requirements-android.txt'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
