plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Chaquopy 12 only supports Python 3.8. Hermes currently targets Python 3.14.
    // Keep this aligned with the Python runtime declared by the main project.
    id 'com.chaquo.python' version '17.1.0'
}

android {
    namespace 'com.nousresearch.hermes'
    compileSdk 34

    defaultConfig {
        applicationId "com.nousresearch.hermes"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // Hermes' current runtime dependencies are declared for Python >=3.14.
        // Do not pip-install hermes-agent here: setup.py intentionally rejects
        // PyPI wheel builds, and desktop wheels are not Android-compatible.
        python {
            version "3.14"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Release signing must be configured with a real keystore and credentials.
// Do not fall back to public/default passwords for a release artifact.
android {
    signingConfigs {
        release {
            storeFile file('keystore/hermes-release.keystore')
            storePassword System.getenv('ANDROID_STORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'hermes'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }
}
